name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号（如 1.4），留空则按最新 tag 自动 +1'
        required: false
        default: ''
      changelog:
        description: '更新说明（写进 Release 正文）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整历史 + tag：版本号从最新 tag 推算

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      # 版本号以最新 tag 为准（main 可能被 gitee 镜像强推回滚，不可信）
      - name: 计算新版本号并写回 AndroidManifest.xml
        if: github.event_name == 'workflow_dispatch'
        id: ver
        env:
          INPUT_VER: ${{ github.event.inputs.version }}
        run: |
          set -e
          git fetch --tags -q origin
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -n "$LATEST" ] && git show "$LATEST:AndroidManifest.xml" > /dev/null 2>&1; then
            M=$(git show "$LATEST:AndroidManifest.xml")
          else
            M=$(cat AndroidManifest.xml)
          fi
          cur=$(echo "$M" | grep -o 'android:versionName="[^"]*"' | head -1 | cut -d'"' -f2)
          code=$(echo "$M" | grep -o 'android:versionCode="[^"]*"' | head -1 | cut -d'"' -f2)
          if [ -n "$INPUT_VER" ]; then
            new="${INPUT_VER#v}"
          else
            IFS='.' read -r -a parts <<< "$cur"
            last=$(( ${#parts[@]} - 1 ))
            parts[$last]=$(( parts[$last] + 1 ))
            new="$(IFS='.'; echo "${parts[*]}")"
          fi
          newcode=$((code + 1))
          sed -i "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"$newcode\"/" AndroidManifest.xml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$new\"/" AndroidManifest.xml
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "versionCode=$newcode" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: 编译 APK（复用 build.sh）
        run: |
          set -e -o pipefail
          export ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -f debug.keystore ]; then mkdir -p build; cp debug.keystore build/debug.keystore; fi
          bash -x build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp build/debug.keystore debug.keystore
          ls -l ProfileLimitUnlock.apk

      - name: 失败时把构建日志推到 diag 分支（免登录排查用）
        if: failure()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B diag
          { echo "run: $GITHUB_RUN_URL"; echo "---- build.log tail ----"; tail -n 150 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(no build log)"; } > build-failure.log
          git add build-failure.log
          git commit -m "diag: build failure log run #$GITHUB_RUN_NUMBER"
          git push -f origin diag

      # 以下仅在手动发版时执行；只推 tag，不提交 main（避免被 gitee 镜像强推回滚吞掉）
      - name: 生成 update.json
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat > update.json <<EOF
          {
            "version": "${{ steps.ver.outputs.tag }}",
            "versionCode": ${{ steps.ver.outputs.versionCode }},
            "zipUrl": "https://github.com/linxiaoran-a/ProfileLimitUnlock/releases/download/${{ steps.ver.outputs.tag }}/ProfileLimitUnlock.apk",
            "changelog": "https://github.com/linxiaoran-a/ProfileLimitUnlock/releases/tag/${{ steps.ver.outputs.tag }}"
          }
          EOF

      - name: 打 tag 并推送（只推 tag）
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: 发布 Release（APK + update.json）
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.changelog }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          if [ -z "$NOTES" ]; then NOTES="本次更新见 README"; fi
          gh release create "$TAG" \
            --title "ProfileLimitUnlock $TAG" \
            --notes "$NOTES" \
            ProfileLimitUnlock.apk update.json
