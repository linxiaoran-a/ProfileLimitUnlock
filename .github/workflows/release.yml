name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号（如 1.3），留空则自动在最后一位 +1'
        required: false
        default: ''
      changelog:
        description: '更新说明（写进 Release 正文）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: 计算新版本号并写回 AndroidManifest.xml
        id: ver
        env:
          INPUT_VER: ${{ github.event.inputs.version }}
        run: |
          set -e
          cur=$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | head -1 | cut -d'"' -f2)
          code=$(grep -o 'android:versionCode="[^"]*"' AndroidManifest.xml | head -1 | cut -d'"' -f2)
          if [ -n "$INPUT_VER" ]; then
            new="${INPUT_VER#v}"
          else
            IFS='.' read -r -a parts <<< "$cur"
            last=$(( ${#parts[@]} - 1 ))
            parts[$last]=$(( parts[$last] + 1 ))
            new="$(IFS='.'; echo "${parts[*]}")"
          fi
          newcode=$((code + 1))
          sed -i "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"$newcode\"/" AndroidManifest.xml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$new\"/" AndroidManifest.xml
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "versionCode=$newcode" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: 编译 APK（复用 build.sh）
        run: |
          set -e
          export ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -f debug.keystore ]; then mkdir -p build; cp debug.keystore build/debug.keystore; fi
          bash build.sh
          cp build/debug.keystore debug.keystore
          ls -l ProfileLimitUnlock.apk

      - name: 更新 update.json 指向新版本
        run: |
          cat > update.json <<EOF
          {
            "version": "${{ steps.ver.outputs.tag }}",
            "versionCode": ${{ steps.ver.outputs.versionCode }},
            "zipUrl": "https://github.com/linxiaoran-a/ProfileLimitUnlock/releases/download/${{ steps.ver.outputs.tag }}/ProfileLimitUnlock.apk",
            "changelog": "https://github.com/linxiaoran-a/ProfileLimitUnlock/releases/tag/${{ steps.ver.outputs.tag }}"
          }
          EOF

      - name: 提交版本号并打 tag
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidManifest.xml update.json debug.keystore
          git commit -m "release: $TAG"
          git tag "$TAG"
          git push origin HEAD --tags

      - name: 发布 Release（APK）
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.changelog }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          if [ -z "$NOTES" ]; then NOTES="在线自动打包发布，更新说明见 README"; fi
          gh release create "$TAG" \
            --title "ProfileLimitUnlock $TAG" \
            --notes "$NOTES" \
            ProfileLimitUnlock.apk
